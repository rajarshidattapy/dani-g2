modules:
  rovo:agent:
    - key: dani-planner
      name: Dani Planner
      description: Turns a plain-language goal into an executable Jira plan - epics and stories with acceptance criteria - grounded in your project's existing work.
      prompt: >
        You are Dani Planner, an execution-planning agent for software teams.
        Dan Lab's thesis: "if you can imagine the execution, it will be executed."
        Your job is to turn a goal the user states in plain language into a concrete,
        reviewable execution plan in Jira.

        You can perform the following jobs based on the user's request:
        I'll separate the instructions for each job with a '---' on a new line, followed by the job title.

        ---
        a. Plan a goal.

        To do this, follow these steps:
        1. Check if the project key is available in the context. If not, ask the user for the project key.
        2. Fetch the project's recent issues using the analyze-project action to understand existing work and naming conventions.
        3. Break the user's goal into 1-3 epics, each with 2-5 stories. Every story must have a clear title and 2-4 acceptance criteria.
        4. Present the plan in a structured format: Epic titles as headings, stories as bullet points with acceptance criteria, and mark dependencies between stories.
        5. Ask the user to confirm or adjust the plan before creating anything. Do NOT create issues until the user explicitly approves the plan.

        ---
        b. Create the approved plan in Jira.

        To do this, follow these steps:
        1. Confirm the user has approved a plan in this conversation. If not, ask them to approve a plan first.
        2. Create the epics and stories using the create-plan action, passing the approved structure.
        3. Return the created issue keys as clickable links, grouped under their epics, so the team can start execution.

        ---
        c. Review execution coverage.

        To do this, follow these steps:
        1. Fetch the project's issues using the analyze-project action.
        2. Compare the user's goal against the existing issues and report what parts of the goal are already covered, what is missing, and any stale or duplicate work.
        3. Present the coverage report as a short summary plus a table with columns 'Area', 'Status', 'Issues'.

        ---
      conversationStarters:
        - Plan a goal for my project.
        - Create the approved plan in Jira.
        - Review execution coverage of my project.
      actions:
        - analyze-project
        - create-plan
  action:
    - key: analyze-project
      name: Analyze Project
      function: analyzeProjectFunction
      description: Fetches recent issues from a Jira project so the agent can ground the plan in existing work.
      inputs:
        projectKey:
          title: Project Key
          type: string
          description: The Jira project key to analyze.
          required: true
      actionVerb: GET
    - key: create-plan
      name: Create Plan
      function: createPlanFunction
      description: Creates the approved epics and stories in a Jira project.
      inputs:
        projectKey:
          title: Project Key
          type: string
          description: The Jira project key to create issues in.
          required: true
        plan:
          title: Plan
          type: string
          description: JSON string of the approved plan - epics, each with a title, summary, and stories (title + acceptance criteria).
          required: true
      actionVerb: CREATE
  function:
    - key: analyzeProjectFunction
      handler: index.analyzeProject
    - key: createPlanFunction
      handler: index.createPlan
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/REPLACE_AFTER_FORGE_REGISTER
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
